<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decibel">
<meta name="theme-color" content="#000000">
<title>Decibel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&family=Orbitron:wght@500;700;900&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --fg:#fff; --chrome:rgba(0,0,0,.45); --accent:#fff; --btnfg:#000; --font:-apple-system, sans-serif; --line:rgba(255,255,255,.18); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; }
  header, footer { position:fixed; left:0; right:0; display:flex; align-items:center; gap:10px; z-index:2;
    font-family:var(--font); color:var(--fg); transition:color .4s; }
  header { top:0; padding:calc(env(safe-area-inset-top) + 8px) 12px 6px; }
  footer { bottom:0; padding:8px 18px calc(env(safe-area-inset-bottom) + 14px); justify-content:space-between; }
  .title { flex:1; text-align:center; min-width:0; }
  #tname { font-size:17px; font-weight:700; letter-spacing:2px; text-transform:uppercase; white-space:nowrap; }
  #ttag { font-size:11px; opacity:.65; letter-spacing:1px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dots { display:flex; justify-content:center; gap:5px; margin-top:6px; }
  #dots i { width:5px; height:5px; border-radius:3px; background:var(--fg); opacity:.25; transition:all .3s; }
  #dots i.on { width:16px; opacity:.95; background:var(--accent); }
  .icon { width:44px; height:44px; border-radius:22px; border:1px solid var(--line); background:var(--chrome);
    color:var(--fg); display:grid; place-items:center; cursor:pointer; padding:0;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .icon svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #go { flex:0 0 auto; min-width:150px; height:54px; border-radius:27px; border:0; cursor:pointer;
    font-family:var(--font); font-size:17px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
    background:var(--accent); color:var(--btnfg); box-shadow:0 0 24px color-mix(in srgb, var(--accent) 45%, transparent);
    transition:transform .15s, background .4s; }
  #go:active { transform:scale(.96); }
  #go.live { background:transparent; color:var(--accent); border:2px solid var(--accent); }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:5; padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);
    background:rgba(18,18,20,.92); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    color:#eee; font-family:-apple-system, Inter, sans-serif; border-radius:22px 22px 0 0;
    transform:translateY(105%); transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  #sheet.open { transform:none; }
  #sheet h3 { margin:0 0 16px; font-size:17px; display:flex; justify-content:space-between; align-items:center; }
  #sheet h3 button { background:none; border:0; color:#8ab4ff; font-size:16px; font-weight:600; cursor:pointer; }
  .row { display:flex; align-items:center; gap:12px; margin:14px 0; font-size:14px; }
  .row label { width:92px; color:#aaa; }
  .row input[type=range] { flex:1; accent-color:#8ab4ff; }
  .row b { min-width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .seg { display:flex; flex:1; background:#2a2a2e; border-radius:10px; padding:3px; }
  .seg button { flex:1; border:0; background:none; color:#ccc; padding:8px; border-radius:8px; font:inherit; cursor:pointer; }
  .seg button.on { background:#4a4a52; color:#fff; font-weight:600; }
  .note { font-size:12px; color:#888; line-height:1.5; margin:12px 0 0; }
  .themes { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:6px; }
  .themes button { aspect-ratio:1; border-radius:12px; border:2px solid transparent; cursor:pointer; padding:0; font-size:10px; color:#fff; font-weight:600; }
  .themes button.on { border-color:#fff; }
  #err { position:fixed; left:20px; right:20px; top:40%; z-index:6; padding:16px; border-radius:14px; display:none;
    background:rgba(200,30,40,.92); color:#fff; font:15px -apple-system, sans-serif; text-align:center; }
  #hint { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 84px); text-align:center; z-index:2;
    font:12px -apple-system, sans-serif; color:var(--fg); opacity:.5; letter-spacing:1px; transition:opacity 1s; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<header id="top">
  <button class="icon" id="prev" aria-label="Previous theme"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="title"><div id="tname"></div><div id="ttag"></div><div id="dots"></div></div>
  <button class="icon" id="next" aria-label="Next theme"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
</header>

<div id="hint">SWIPE TO CHANGE THEME</div>

<footer id="bot">
  <button class="icon" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button id="go">Start</button>
  <button class="icon" id="rst" aria-label="Reset readings"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
</footer>

<div id="sheet">
  <h3>Settings <button id="close">Done</button></h3>
  <div class="row"><label>Theme</label></div>
  <div class="themes" id="themeGrid"></div>
  <div class="row"><label>Calibration</label><input type="range" id="offset" min="60" max="130" step="1"><b id="offv"></b></div>
  <div class="row"><label>Response</label><div class="seg" id="resp"><button data-v="fast">Fast</button><button data-v="slow">Slow</button></div></div>
  <p class="note">Fast (125 ms) follows quick sounds like claps; Slow (1 s) gives a steadier reading. Phone mics are estimates
    (about ±5 dB). Compare with a known meter and move Calibration until they match. Settings are saved on this phone.</p>
</div>

<div id="err"></div>

<script>
(() => {
"use strict";
// ───────────────────────── basics ─────────────────────────
const TAU = Math.PI * 2, MIN_DB = 20, MAX_DB = 120;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const norm = d => d == null ? 0 : clamp((d - MIN_DB) / (MAX_DB - MIN_DB), 0, 1);
const fmt = (v, dec = 0) => v == null || !isFinite(v) ? "--" : v.toFixed(dec);
const lerp = (a, b, k) => a + (b - a) * k;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const status = d => d == null ? "STANDBY" : d < 35 ? "VERY QUIET" : d < 50 ? "QUIET" : d < 65 ? "MODERATE" :
  d < 75 ? "CONVERSATION" : d < 85 ? "LOUD" : d < 100 ? "VERY LOUD" : "DANGEROUS";
const levelColor = d => d == null ? "#666" : d < 60 ? "#3ddc84" : d < 75 ? "#c6e34a" : d < 85 ? "#ffc940" : d < 100 ? "#ff8a3d" : "#ff3b4e";
// seeded random for stable decorations
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ───────────────────────── state ─────────────────────────
const NB = 48, HIST = 600;               // spectrum bands, history samples (30 s @ 20 Hz)
const S = {
  db: null, raw: null, peak: null, peakT: 0, min: null, max: null, leq: null, eSum: 0, eN: 0,
  hist: [], bands: new Float32Array(NB), wave: new Float32Array(256),
  running: false, t0: 0, elapsed: 0, offset: store.get("offset", 100), resp: store.get("resp", "fast")
};
const demo = /[?&]demo/.test(location.search);

// ───────────────────────── audio engine ─────────────────────────
let actx, analyser, stream, tbuf, fbuf, wakeLock, bandIdx = [];
function buildBands(sr, n) {
  bandIdx = [];
  const lo = 40, hi = 16000;
  for (let i = 0; i <= NB; i++) {
    const f = lo * Math.pow(hi / lo, i / NB);
    bandIdx.push(clamp(Math.round(f / (sr / 2) * n), 1, n - 1));
  }
}
async function start() {
  $("err").style.display = "none";
  if (!demo) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return showErr("This browser can't use the microphone here. Open the https link in Safari.");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (e) { return showErr("Microphone access was blocked. Allow the microphone for this site in Settings → Safari, then try again."); }
    actx = new (window.AudioContext || window.webkitAudioContext)();
    await actx.resume();
    const src = actx.createMediaStreamSource(stream);
    analyser = actx.createAnalyser();
    analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);
    tbuf = new Float32Array(analyser.fftSize);
    fbuf = new Float32Array(analyser.frequencyBinCount);
    buildBands(actx.sampleRate, analyser.frequencyBinCount);
  }
  S.running = true; S.t0 = performance.now() - S.elapsed * 1000;
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  $("go").textContent = "Stop"; $("go").classList.add("live");
}
function stop() {
  S.running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (actx) actx.close();
  stream = actx = analyser = null;
  try { wakeLock && wakeLock.release(); } catch (e) {}
  $("go").textContent = "Start"; $("go").classList.remove("live");
}
function reset() {
  Object.assign(S, { peak: null, min: null, max: null, leq: null, eSum: 0, eN: 0, elapsed: 0, t0: performance.now() });
  S.hist.length = 0;
  themes.forEach(th => th.reset && th.reset());
}
function showErr(m) { const e = $("err"); e.textContent = m; e.style.display = "block"; setTimeout(() => e.style.display = "none", 6000); }

let lastHist = 0;
function sample(now, dt) {
  if (!S.running) { // settle visuals when stopped
    for (let i = 0; i < NB; i++) S.bands[i] *= 0.9;
    for (let i = 0; i < S.wave.length; i++) S.wave[i] *= 0.85;
    return;
  }
  S.elapsed = (now - S.t0) / 1000;
  let dbfs;
  if (demo) {
    const t = now / 1000;
    const spl = 62 + 14 * Math.sin(t * 0.6) + 7 * Math.sin(t * 2.1) + 4 * Math.sin(t * 5.3) + Math.random() * 3;
    const lv = norm(spl);
    for (let i = 0; i < NB; i++) S.bands[i] = clamp(0.15 + 0.6 * Math.exp(-((i - 14) ** 2) / 90) * (0.6 + 0.4 * Math.sin(t * 2 + i * 0.4)) + Math.random() * 0.12 + lv * 0.25 - 0.1, 0, 1);
    for (let i = 0; i < S.wave.length; i++) S.wave[i] = (Math.sin(i * 0.25 + t * 9) * 0.5 + Math.sin(i * 0.9 + t * 13) * 0.25 + (Math.random() - .5) * 0.2) * lv * 0.25;
    dbfs = spl - S.offset;
  } else {
    analyser.getFloatTimeDomainData(tbuf);
    let s = 0; for (let i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i];
    dbfs = 20 * Math.log10(Math.max(Math.sqrt(s / tbuf.length), 1e-9));
    const step = tbuf.length / S.wave.length;
    for (let i = 0; i < S.wave.length; i++) S.wave[i] = tbuf[Math.floor(i * step)];
    analyser.getFloatFrequencyData(fbuf);
    for (let b = 0; b < NB; b++) {
      let m = -140; for (let k = bandIdx[b]; k <= Math.max(bandIdx[b], bandIdx[b + 1] - 1); k++) m = Math.max(m, fbuf[k]);
      S.bands[b] = lerp(S.bands[b], clamp((m + 100) / 75, 0, 1), 0.5);
    }
  }
  const raw = Math.max(0, dbfs + S.offset);
  S.raw = raw;
  const tau = S.resp === "slow" ? 1.0 : 0.125;
  const a = 1 - Math.exp(-dt / tau);
  S.db = S.db == null ? raw : S.db + (raw - S.db) * a;
  if (S.elapsed > 0.4) {
    S.min = S.min == null ? S.db : Math.min(S.min, S.db);
    S.max = S.max == null ? S.db : Math.max(S.max, S.db);
  }
  if (S.peak == null || S.db > S.peak || now - S.peakT > 2500) { S.peak = S.db; S.peakT = now; }
  S.eSum += Math.pow(10, S.db / 10) * dt; S.eN += dt;
  S.leq = 10 * Math.log10(S.eSum / S.eN);
  if (now - lastHist > 50) { S.hist.push(S.db); lastHist = now; if (S.hist.length > HIST) S.hist.shift(); }
}

// ───────────────────────── drawing helpers ─────────────────────────
function glow(g, c, b) { g.shadowColor = c; g.shadowBlur = b; }
function noGlow(g) { g.shadowBlur = 0; g.shadowColor = "transparent"; }
function line(g, x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function text(g, s, x, y, font, color, align = "center", base = "middle") {
  g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y);
}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function clock(sec) { const m = Math.floor(sec / 60), s = sec % 60; return String(m).padStart(2, "0") + ":" + s.toFixed(1).padStart(4, "0"); }
function histPath(g, x, y, w, h, n = HIST) {
  const H = S.hist; if (H.length < 2) return false;
  const step = w / (n - 1), off = n - H.length;
  g.beginPath();
  for (let i = 0; i < H.length; i++) {
    const px = x + (off + i) * step, py = y + h - norm(H[i]) * h;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  return true;
}
const arcAng = (v, a0, sweep) => a0 + norm(v) * sweep;

// ───────────────────────── themes ─────────────────────────
const themes = [

// 1 ── COVERT OPS ─────────────────────────────────────────
{ name: "Covert Ops", tag: "Field surveillance HUD", swatch: "#ff2b3a",
  ui: { fg: "#ff4b55", chrome: "rgba(40,0,0,.55)", accent: "#ff2b3a", btnfg: "#000", font: "Rajdhani, sans-serif", line: "rgba(255,60,70,.4)" },
  draw(g, w, h, r, t) {
    const red = "#ff2b3a", dim = "rgba(255,43,58,.18)";
    g.fillStyle = "#040202"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,40,50,.06)"; g.lineWidth = 1;
    for (let x = (t * 6) % 28; x < w; x += 28) line(g, x, 0, x, h);
    for (let y = 0; y < h; y += 28) line(g, 0, y, w, y);
    // corner brackets
    g.strokeStyle = red; g.lineWidth = 2; const b = 18, m = 10;
    [[r.x + m, r.y, 1, 1], [r.x + r.w - m, r.y, -1, 1], [r.x + m, r.y + r.h, 1, -1], [r.x + r.w - m, r.y + r.h, -1, -1]].forEach(([x, y, sx, sy]) => {
      g.beginPath(); g.moveTo(x, y + b * sy); g.lineTo(x, y); g.lineTo(x + b * sx, y); g.stroke(); });
    text(g, "ACOUSTIC SURVEILLANCE // CH-01", r.x + 22, r.y + 16, "600 12px Rajdhani", red, "left");
    text(g, "T+ " + clock(S.elapsed), r.x + r.w - 22, r.y + 16, "600 12px Rajdhani", red, "right");
    const cx = w / 2, R = Math.min(r.w * 0.38, r.h * 0.27), cy = r.y + 30 + R * 1.12;
    const a0 = Math.PI * 0.75, sw = Math.PI * 1.5, lv = norm(S.db);
    for (let i = 0; i <= 100; i++) {
      const a = a0 + i / 100 * sw, on = S.db != null && i / 100 <= lv, major = i % 10 === 0;
      g.strokeStyle = on ? red : dim; g.lineWidth = major ? 3 : 2;
      if (on) glow(g, red, 10);
      const r1 = R * (major ? 0.88 : 0.92), r2 = R;
      line(g, cx + Math.cos(a) * r1, cy + Math.sin(a) * r1, cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      noGlow(g);
      if (major) text(g, String(20 + i), cx + Math.cos(a) * R * 1.1, cy + Math.sin(a) * R * 1.1, "600 11px Rajdhani", on ? red : "rgba(255,60,70,.45)");
    }
    if (S.peak != null) { const a = arcAng(S.peak, a0, sw); g.fillStyle = "#fff";
      g.beginPath(); g.arc(cx + Math.cos(a) * R * 1.03, cy + Math.sin(a) * R * 1.03, 3, 0, TAU); g.fill(); }
    g.save(); g.translate(cx, cy);
    g.rotate(t * 0.4); g.setLineDash([4, 10]); g.strokeStyle = "rgba(255,43,58,.5)"; g.lineWidth = 1.5;
    g.beginPath(); g.arc(0, 0, R * 0.78, 0, TAU); g.stroke();
    g.rotate(-t * 0.9); g.setLineDash([R * 0.5, R * 0.3]); g.lineWidth = 3; g.strokeStyle = "rgba(255,43,58,.35)";
    g.beginPath(); g.arc(0, 0, R * 0.7, 0, TAU); g.stroke(); g.restore(); g.setLineDash([]);
    glow(g, red, 18);
    text(g, fmt(S.db), cx, cy - R * 0.04, `700 ${R * 0.62}px Rajdhani`, "#fff");
    noGlow(g);
    text(g, "dB SPL", cx, cy + R * 0.34, "600 14px Rajdhani", red);
    // status
    const alert = S.db != null && S.db >= 85, blink = !alert || Math.floor(t * 3) % 2;
    const sy = cy + R * 1.18;
    g.strokeStyle = red; g.lineWidth = 1.5; rrect(g, cx - 110, sy - 15, 220, 30, 2); g.stroke();
    if (alert && blink) { g.fillStyle = "rgba(255,43,58,.25)"; g.fill(); }
    text(g, "STATUS: " + (S.db == null ? "STANDBY" : S.db < 70 ? "NOMINAL" : S.db < 85 ? "ELEVATED" : "BREACH"), cx, sy + 1, "700 15px Rajdhani", blink ? red : "#600");
    // stats
    const st = [["PEAK", S.peak], ["MIN", S.min], ["LEQ", S.leq], ["MAX", S.max]], bw = (r.w - 48) / 4, by = sy + 30;
    st.forEach(([k, v], i) => { const x = r.x + 24 + i * bw;
      g.strokeStyle = "rgba(255,43,58,.35)"; g.lineWidth = 1; g.strokeRect(x + 3, by, bw - 6, 44);
      text(g, k, x + bw / 2, by + 12, "600 10px Rajdhani", "rgba(255,80,90,.7)");
      text(g, fmt(v, 1), x + bw / 2, by + 31, "700 19px Rajdhani", "#fff"); });
    // oscilloscope
    const oy = by + 62, oh = Math.max(30, r.y + r.h - oy - 8);
    g.strokeStyle = "rgba(255,43,58,.2)"; line(g, r.x + 24, oy + oh / 2, r.x + r.w - 24, oy + oh / 2);
    g.strokeStyle = red; g.lineWidth = 1.6; glow(g, red, 8); g.beginPath();
    for (let i = 0; i < S.wave.length; i++) { const x = r.x + 24 + i / (S.wave.length - 1) * (r.w - 48), y = oy + oh / 2 - clamp(S.wave[i] * 4, -1, 1) * oh / 2;
      i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke(); noGlow(g);
    // sweep
    const sx = (t * 0.25 % 1) * w; const gr = g.createLinearGradient(sx - 60, 0, sx, 0);
    gr.addColorStop(0, "rgba(255,43,58,0)"); gr.addColorStop(1, "rgba(255,43,58,.08)"); g.fillStyle = gr; g.fillRect(sx - 60, 0, 60, h);
  } },

// 2 ── HOLOGRAM ─────────────────────────────────────────
{ name: "Hologram", tag: "Starship bridge projection", swatch: "#29e6ff",
  ui: { fg: "#9ff3ff", chrome: "rgba(0,30,40,.5)", accent: "#29e6ff", btnfg: "#001218", font: "Orbitron, sans-serif", line: "rgba(41,230,255,.35)" },
  init() { seed = 11; this.stars = Array.from({ length: 90 }, () => [rnd(), rnd(), rnd() * 1.4 + .3, rnd()]); },
  draw(g, w, h, r, t) {
    const c = "#29e6ff";

  $("dots").innerHTML = themes.map((_, k) => `<i class="${k === cur ? "on" : ""}"></i>`).join("");
  [...$("themeGrid").children].forEach((b, k) => b.classList.toggle("on", k === cur));
  document.querySelector('meta[name=theme-color]').content = cur === 5 || cur === 7 ? "#f2ecda" : "#000";
}
function layoutRect() {
  const tb = $("top").getBoundingClientRect().bottom, bb = $("bot").getBoundingClientRect().top;
  return { x: 0, y: tb + 6, w: W, h: Math.max(200, bb - tb - 12) };
}
let last = performance.now(), fade = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  sample(now, dt);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.save();
  try { themes[cur].draw(g, W, H, layoutRect(), now / 1000, dt); } catch (e) { console.error(e); }
  g.restore();
  if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); fade = Math.max(0, fade - dt * 4); }
  requestAnimationFrame(frame);
}

// ───────────────────────── controls ─────────────────────────
function go(d) { fade = 0.6; setTheme(cur + d); $("hint").style.opacity = 0; }
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("go").onclick = () => S.running ? stop() : start();
$("rst").onclick = reset;
let tx = null, ty = null;
cv.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cv.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1); tx = null; }, { passive: true });
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); if (e.key === " ") $("go").click(); });
// settings
$("gear").onclick = () => $("sheet").classList.add("open");
$("close").onclick = () => $("sheet").classList.remove("open");
$("themeGrid").innerHTML = themes.map((th, k) => `<button style="background:${th.swatch};color:${["#f2f2ef", "#efe7d2", "#33ff77", "#29e6ff", "#e8c46a"].includes(th.swatch) ? "#111" : "#fff"}" data-k="${k}">${k + 1}</button>`).join("");
$("themeGrid").onclick = e => { const k = e.target.dataset.k; if (k != null) { fade = 0.6; setTheme(+k); } };
$("offset").value = S.offset; $("offv").textContent = "+" + S.offset;
$("offset").oninput = e => { S.offset = +e.target.value; $("offv").textContent = "+" + S.offset; store.set("offset", S.offset); };
const setResp = v => { S.resp = v; store.set("resp", v); [...$("resp").children].forEach(b => b.classList.toggle("on", b.dataset.v === v)); };
$("resp").onclick = e => e.target.dataset.v && setResp(e.target.dataset.v); setResp(S.resp);
document.addEventListener("visibilitychange", async () => { if (!document.hidden && S.running) { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {} } });
if (store.get("seenHint", false)) $("hint").style.opacity = 0; else { store.set("seenHint", true); setTimeout(() => $("hint").style.opacity = 0, 5000); }

setTheme(cur);
if (demo) { const m = location.search.match(/theme=(\d+)/); if (m) setTheme(+m[1] - 1); start(); }
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
